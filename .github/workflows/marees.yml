name: Marées et site

# GitHub Pages publie un artefact unique qui remplace tout le site : marées et pages statiques
# doivent donc voyager ensemble à chaque déploiement.
#
# D'où deux chemins selon ce qui déclenche l'exécution :
#
#   - quotidien, ou lancé à la main : les marées sont regénérées depuis l'API, qui n'expose que
#     la fenêtre J-30 à J+30 ;
#   - à la publication d'une page : les marées déjà en ligne sont reprises telles quelles.
#     Modifier une page n'a aucune raison de coûter 131 appels d'API, un par port.
on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Générer marees.json depuis l'API
        if: github.event_name != 'push'
        env:
          API_MAREE_KEY: ${{ secrets.API_MAREE_KEY }}
        run: node marees.mjs

      # `--fail` plutôt qu'un fichier vide en cas d'erreur : sans marees.json, l'app perd son
      # pré-remplissage des marées sans rien signaler. Mieux vaut que la publication échoue.
      - name: Reprendre les marées déjà publiées
        if: github.event_name == 'push'
        run: |
          mkdir -p site
          curl --fail --silent --show-error --location \
            --output site/marees.json https://kerpesk.fr/marees.json
          echo "marees.json repris : $(wc -c < site/marees.json) octets"

      # Le site et les marées partagent une publication unique : les pages statiques doivent
      # donc rejoindre l'artefact à chaque exécution, sans quoi la mise à jour quotidienne des
      # marées les ferait disparaître.
      - name: Ajouter les pages du site
        run: cp -R pages/. site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@v5
