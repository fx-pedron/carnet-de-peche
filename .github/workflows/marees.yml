name: Marées et site

# GitHub Pages publie un artefact unique qui remplace tout le site : marées et pages statiques
# doivent donc voyager ensemble à chaque déploiement.
#
# D'où deux chemins selon ce qui déclenche l'exécution :
#
#   - quotidien, ou lancé à la main : les marées sont regénérées depuis l'API, qui n'expose que
#     la fenêtre J-30 à J+30 ;
#   - à la publication d'une page : les marées déjà en ligne sont reprises telles quelles.
#     Modifier une page n'a aucune raison de coûter 131 appels d'API, un par port.
on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      # Les identifiants restent dans le clone : le commit d'entretien, en fin de job, pousse
      # avec eux.
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Générer marees.json depuis l'API
        if: github.event_name != 'push'
        env:
          API_MAREE_KEY: ${{ secrets.API_MAREE_KEY }}
        run: node marees.mjs

      # `--fail` plutôt qu'un fichier vide en cas d'erreur : sans marees.json, l'app perd son
      # pré-remplissage des marées sans rien signaler. Mieux vaut que la publication échoue.
      - name: Reprendre les marées déjà publiées
        if: github.event_name == 'push'
        run: |
          mkdir -p site
          curl --fail --silent --show-error --location \
            --output site/marees.json https://kerpesk.fr/marees.json
          echo "marees.json repris : $(wc -c < site/marees.json) octets"

      # Le site et les marées partagent une publication unique : les pages statiques doivent
      # donc rejoindre l'artefact à chaque exécution, sans quoi la mise à jour quotidienne des
      # marées les ferait disparaître.
      - name: Ajouter les pages du site
        run: cp -R pages/. site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@v5

      # GitHub désactive un workflow planifié dès 60 jours sans activité sur le dépôt, et les
      # exécutions de ce workflow n'en sont pas : seuls les commits comptent. Un mois sans
      # toucher au code suffit donc à perdre les marées, d'où ce commit d'entretien tous les
      # 30 jours. Le fichier touché est hors des `paths` du déclencheur `push` : la publication
      # ne se relance pas en cascade.
      - name: Garder le workflow en vie
        if: github.event_name == 'schedule'
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt 2592000 ]; then
            echo "Dernier commit il y a $(( age / 86400 )) jours : rien à faire."
            exit 0
          fi
          date -u +%FT%TZ > .github/derniere-activite
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/derniere-activite
          git commit -m 'Entretien : garder les marees planifiees actives'
          git push
